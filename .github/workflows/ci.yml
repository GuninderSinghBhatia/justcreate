name: CI

on:
  push:
  pull_request:

jobs:
  web-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
        working-directory: apps/web
      - name: Type-check web
        run: npx tsc --noEmit -p apps/web
      - name: Lint web
        run: npm run lint -w web
      - name: Type-check extension
        run: npm run compile -w extension
      - name: Build extension
        run: npm run build -w extension
      - name: Build MCP server
        run: npm run build -w @justcreate/mcp
      - name: Build web
        run: npm run build -w web
        env:
          # Build-time placeholders; the build doesn't call Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          SUPABASE_SECRET_KEY: sb_secret_ci

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Unit tests
        run: uv run pytest -q

  worker-image:
    # Proves the worker Dockerfile builds (CPU torch, baked-in CLIP weights) and runs as user 1000.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build worker image
        run: docker build -t justcreate-worker apps/worker
      - name: Smoke test (imports, CLIP loads offline, config falls back to env)
        run: |
          docker run --rm --network none -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_SECRET_KEY=x \
            justcreate-worker python -c "from worker.config import load_settings; s = load_settings(); \
          from worker.embed import get_clip; import numpy as np; v = get_clip(s).text('neon dashboard'); \
          print('provider', s.provider, 'clip dims', v.shape[0]); assert v.shape[0] == 512"

  deploy-worker:
    # Deploys apps/worker to Modal once tests and the image build pass. Needs the MODAL_TOKEN_ID and
    # MODAL_TOKEN_SECRET secrets in the GitHub repo settings; skipped until they exist.
    needs: [worker, worker-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Deploy to Modal
        if: env.MODAL_TOKEN_ID != ''
        run: uvx modal deploy modal_app.py
