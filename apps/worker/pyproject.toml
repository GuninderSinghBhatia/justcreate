[project]
name = "justcreate-worker"
version = "0.1.0"
description = "JUSTCREATE AI worker: per-reference analysis, CLIP embeddings, clustering"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.4",
  "scikit-learn>=1.5",
  "open-clip-torch>=2.26",
  "torch>=2.4",
  "torchvision>=0.19",  # declared so it can follow torch to the CPU index on Linux
  "pydantic>=2.8",
  "google-genai>=1.30",
  "groq>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux (containers): CPU-only torch. The default Linux wheel bundles CUDA (~2 GB) the worker never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
