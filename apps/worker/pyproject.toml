[project]
name = "justcreate-worker"
version = "0.1.0"
description = "JUSTCREATE AI worker: per-reference analysis, CLIP embeddings, clustering"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.4",
  "scikit-learn>=1.5",
  "open-clip-torch>=2.26",
  "torch>=2.4",
  "pydantic>=2.8",
  "google-genai>=1.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
